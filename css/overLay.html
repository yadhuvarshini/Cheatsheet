<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Document</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body .container{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
            position: relative;
        }

        .container .overlayText{
            opacity: 0;
        }

        .container img:hover + .overlayText {
            opacity: 1;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6); /* Black with transparency */
            color: white; /* Text color */
            display: flex; /* To center the text */
            justify-content: center;
            align-items: center;
        }
        
    </style>
</head>
<body>
    <h1>Overlay over Image</h1>

    <div class="container">    
        <img src="https://placehold.co/600x400" alt="">
        <div class="overlayText">Overlay Text</div>
    </div>

</body>
</html>
