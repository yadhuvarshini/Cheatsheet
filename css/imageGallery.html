<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        

        .image-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0;
        }

        .image-container img {
           
            display: block;
            margin: 0;
            padding: 0;
        }

        .overlay{
            opacity: 0;
        }

        .image-container img:hover .overlay {
            transform: scale(1.1);
            transition: transform 0.3s ease;
            color: thistle;
            opacity: 1;

        }

    </style>
</head>
<body>

    <h1>Image Gallery</h1>
    <br>
    <div class="ImageGallery">
        <div class="image-container">
            <img src="https://placehold.co/300x400" alt="Image 1">
            <img src="https://placehold.co/200x300" alt="Image 2">
            <img src="https://placehold.co/400x400" alt="Image 3">
            <img src="https://placehold.co/200x400" alt="Image 4">
            <img src="https://placehold.co/300x400" alt="Image 1">
            <img src="https://placehold.co/200x300" alt="Image 2">
            <img src="https://placehold.co/400x400" alt="Image 3">
            <img src="https://placehold.co/200x400" alt="Image 4">
        </div>
    </div>
    
    
</body>
</html>
